name: Bug Report
description: Report something in MediaScout that isn't working correctly
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: What did you do, in order, to trigger this?
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Windows Version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: MediaScout Version
      description: Found under Help > About
      placeholder: e.g. 3.0.11.0
    validations:
      required: true
